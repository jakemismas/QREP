name: Guards

# Two required checks, run from main's copy of this file and of the scripts:
#   golden-guard  tests/golden changes only through [bless] commits
#                 (scripts/golden_guard.py)
#   corpus-guard  no private-tier or unlicensed corpus file in the merge
#                 result or anywhere in the change range (scripts/corpus_guard.py)
#
# Why pull_request_target: on pull_request GitHub runs the pull request's own
# copy of the workflow and checks out its own scripts, so a pull request
# could switch its guard off (`|| true`, `if: false`, an edited script) and
# still report success. On pull_request_target GitHub reads this file from
# the default branch, actions/checkout checks out the default branch, and the
# jobs fetch the pull request's commits only as data for git (log, diff-tree,
# ls-tree, merge-tree, cat-file). Never check out, install or run anything
# from the pull request here: this trigger runs with the base repository's
# token.
#
# Limits and consequences:
#   - This keeps a pull request from editing these jobs, not from adding a
#     job with the same name to a workflow that runs its own copy (ci.yml
#     does). Branch protection matches a required check by name, and GitHub
#     does not document which run counts when two runs of one name disagree
#     on a commit. So no other workflow on main may use these job names, and
#     a pull request that touches .github/workflows/ or scripts/*_guard.py
#     needs Jake's review before it merges.
#   - A change to this file or to scripts/*_guard.py takes effect only once
#     it is on main. These checks first appear on pull requests opened or
#     updated after this file lands.
#   - GitHub blocks pull_request_target in public repositories from
#     2026-11-02 unless a repository Actions event policy allows it for this
#     file; #108 tracks that setting. Without it these checks never report.
#   - The edited type re-runs the guards when a pull request's base branch
#     changes (by hand, or when GitHub retargets a stacked pull request), so
#     a result computed against the old base cannot stand on the head commit.
#     Title and body edits re-run them too, which takes seconds. No job-level
#     `if:` skips those runs, because a skipped job reports success.
#   - No workflow_dispatch: a dispatch runs the chosen branch's copy of this
#     file and attaches its result to that branch's tip, where it could
#     replace a failing check. Re-run a failed run instead.
#   - No path filters: a required check that never runs blocks every merge.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer event on a pull request (a push, a reopen, an edit) cancels that
  # pull request's older run. Every other run gets a group of its own, so runs
  # on main are never cancelled.
  group: guards-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  golden-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The base is the target branch's current tip, so the guard judges what
      # merging the pull request now would do.
      - name: Resolve the change range (pull request commits as data only)
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              git fetch --no-tags --quiet origin \
                "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
                "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
              if ! git cat-file -e "$PR_HEAD^{commit}"; then
                echo "::error::pull request head $PR_HEAD is not in refs/pull/$PR_NUMBER/head (was the branch force-pushed?)"
                exit 1
              fi
              base=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
              head=$PR_HEAD ;;
            push)
              head=$GITHUB_SHA
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                base=""
              else
                base=$PUSH_BEFORE
              fi ;;
            *)
              echo "::error::unexpected event $EVENT_NAME"
              exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: tests/golden changes only through [bless] commits
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          if [ -z "$RANGE_BASE" ]; then
            echo "golden_guard: no earlier commit to compare (new ref); nothing to check"
          else
            python3 scripts/golden_guard.py "$RANGE_BASE" "$RANGE_HEAD"
          fi

  corpus-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A file version that a later commit replaced or removed is gone from
      # the tree but stays in main's history after the merge, so every version
      # the range wrote is checked too. Same range resolution as golden-guard,
      # and the tree checked is the merge result, as golden-guard's is.
      - name: Resolve the change range (pull request commits as data only)
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              git fetch --no-tags --quiet origin \
                "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
                "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
              if ! git cat-file -e "$PR_HEAD^{commit}"; then
                echo "::error::pull request head $PR_HEAD is not in refs/pull/$PR_NUMBER/head (was the branch force-pushed?)"
                exit 1
              fi
              base=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
              head=$PR_HEAD ;;
            push)
              head=$GITHUB_SHA
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                base=""
              else
                base=$PUSH_BEFORE
              fi ;;
            *)
              echo "::error::unexpected event $EVENT_NAME"
              exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: No private-tier or unlicensed corpus files in the merge result or the change range
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          if [ -z "$RANGE_BASE" ]; then
            python3 scripts/corpus_guard.py
          else
            python3 scripts/corpus_guard.py --range "$RANGE_BASE" "$RANGE_HEAD"
          fi
