name: Pages

# The product site changes only on a release tag or a manual dispatch, never
# on an ordinary merge to main, so the live app stays at the last release
# while a sprint lands work. Roll back by dispatching this workflow on the
# previous tag (force-pushing is banned, so redeploying is the undo).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The full CI workflow, including every required check, runs first on the
  # exact commit being deployed and uploads the composed site artifact.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      publish: true

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live-spike:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install python deps (pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Spike e2e against the deployed Pages site
        run: npx playwright test
        working-directory: web
        env:
          SPIKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Native pypdf checks on the live-site booklet
        run: pytest tests/test_wasm_artifacts.py -q
        env:
          QREP_WASM_PDF: web/test-results/spike/booklet.pdf
