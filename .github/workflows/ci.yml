name: CI

# Job names are the required status checks on main; keep them stable. No job
# may get a path filter: a required check that never runs stays pending and
# blocks every merge. The golden and corpus guards live in guards.yml, which
# runs main's copy of them so that a pull request cannot switch its own guard
# off; the test job still runs their unit tests here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # pages.yml runs this whole workflow on a release tag and deploys only what
  # passed it; `publish` adds the Pages artifact upload.
  workflow_call:
    inputs:
      publish:
        description: Upload the composed site as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's older run. Every other run gets a
  # group of its own, so runs on main are never cancelled or replaced.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (pinned by constraints.txt)
        run: |
          python -m pip install pip==25.0.1
          pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  web-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install python deps (pinned by constraints.txt)
        run: |
          python -m pip install pip==25.0.1
          pip install -e ".[dev]" -c constraints.txt
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Lint (oxlint, fails on errors)
        run: npm run lint -- --format=github
        working-directory: web
      - name: Cache vendored wheels
        uses: actions/cache@v4
        with:
          path: web/.vendor-cache
          key: vendor-${{ hashFiles('web/vendor.lock.json') }}
      - name: Vendor pinned Pyodide runtime and wheels
        run: node scripts/vendor.mjs
        working-directory: web
      - name: Build qrep wheel into the site
        run: node scripts/wheel.mjs
        working-directory: web
        env:
          QREP_PYTHON: python
      - name: Build site (prebuild refuses a stale wheel)
        run: npm run build
        working-directory: web
      - name: Unit tests (vitest)
        run: npm test -- --run
        working-directory: web
      - name: Verify hashed and versioned artifact filenames
        run: |
          bad=$(find web/dist/assets -type f | grep -Ev -- '-[A-Za-z0-9_-]{8,}\.[a-z0-9]+$' || true)
          if [ -n "$bad" ]; then
            echo "assets without content hashes:"; echo "$bad"; exit 1
          fi
          ls web/dist/wheels/qrep-*-py3-none-any.whl
          ls web/dist/wheels/manifest.json
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Spike e2e against the built site
        run: npx playwright test
        working-directory: web
      - name: Native pypdf checks on the browser-produced booklet
        run: pytest tests/test_wasm_artifacts.py -q
        env:
          QREP_WASM_PDF: web/test-results/spike/booklet.pdf
      - name: Native pypdf checks on the downloaded booklet (S5)
        run: pytest tests/test_wasm_artifacts.py -q
        env:
          QREP_WASM_PDF: web/test-results/downloads/booklet.pdf
      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-artifacts
          path: web/test-results/spike/
          if-no-files-found: ignore
      - name: Compose Pages artifact (app at root, legacy viewer and demo only)
        if: inputs.publish
        run: node web/scripts/compose-site.mjs _site
      - name: Upload Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pyodide-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Cache vendored wheels
        uses: actions/cache@v4
        with:
          path: web/.vendor-cache
          key: vendor-${{ hashFiles('web/vendor.lock.json') }}
      - name: Vendor pinned Pyodide runtime and wheels
        run: node scripts/vendor.mjs
        working-directory: web
      - name: Build qrep wheel
        run: node scripts/wheel.mjs
        working-directory: web
        env:
          QREP_PYTHON: python
      - name: Full pytest suite under pinned Pyodide (test deps pinned by constraints.txt)
        run: node scripts/pytest-pyodide.mjs
        working-directory: web

