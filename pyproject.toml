[build-system]
# Pinned, with the backend's own dependencies (pip resolves these into an
# isolated build environment that constraints.txt does not reach): this
# backend builds the qrep wheel the web app ships, and pathspec decides which
# files go into it.
requires = [
    "hatchling==1.32.4",
    "packaging==26.2",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "qrep"
version = "0.3.0"
description = "Quilt Reverse Engineering Platform: photographs to production-ready quilt patterns"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jake Mismas", email = "jake@jakemismas.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "numpy",
    # The Pyodide distribution supplies opencv-python in the browser; the
    # marker keeps the wheel metadata honest about that substitution.
    "opencv-python-headless; sys_platform != 'emscripten'",
    "Pillow",
    "svgwrite",
    "reportlab",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pypdf",
]

[project.scripts]
qrep = "qrep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["qrep"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
